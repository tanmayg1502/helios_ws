### AMCL: localization against an ALREADY-BUILT map (publishes map -> odom)
#
# This is the "I have a map, where am I in it?" half of the problem, as
# opposed to slam_toolbox/rtabmap which build the map in the first place. The
# map is read-only here: AMCL never modifies the .pgm.
#
# TF ownership (REP-105): AMCL owns map -> odom, exactly like slam_toolbox
# does when mapping. So DO NOT run this at the same time as
# slam_toolbox.launch.py or rtabmap with publish_tf_map:=true -- they would
# fight over the same transform. The EKF still owns odom -> base_link.

amcl:
  ros__parameters:
    # --- Frames / topics -------------------------------------------------
    base_frame_id: 'base_link'
    odom_frame_id: 'odom'
    global_frame_id: 'map'
    scan_topic: '/scan'      # must match urg_node2's remapped output
    tf_broadcast: true       # publish map -> odom; false makes AMCL estimate-only

    # How long a published map -> odom stays valid. Slightly longer than one
    # AMCL update period so consumers never see a gap between corrections.
    transform_tolerance: 1.0    # s, post-dating applied to the published TF

    # --- Motion model ----------------------------------------------------
    # OmniMotionModel, NOT DifferentialMotionModel. This rover is mecanum: it
    # can translate sideways without rotating. The differential model assumes
    # any lateral displacement is impossible and would treat a strafe as
    # sensor noise, dragging the particle cloud badly.
    robot_model_type: 'nav2_amcl::OmniMotionModel'

    # Dimensionless odometry noise gains. alpha5 is deliberately the largest:
    # ground tests showed this rover tracks well forward/back and in yaw but
    # drifts off-axis when strafing, because lateral motion comes entirely from
    # the free rollers with no body-level feedback. Same reasoning as the raised
    # y covariance in wheel_odometry.yaml -- tell the filter not to over-trust
    # sideways odometry, so scan matching gets to correct it.
    alpha1: 0.2   # rotation noise from rotation
    alpha2: 0.2   # rotation noise from translation
    alpha3: 0.2   # translation noise from translation
    alpha4: 0.2   # translation noise from rotation
    alpha5: 0.4   # lateral (strafe) noise, omni model only

    # --- Particle filter -------------------------------------------------
    # max_particles is the cost knob AND the global-localization knob: too few
    # and a from-scratch (kidnapped-robot) reinitialization has no chance of
    # seeding a particle near the true pose. 2000 is a reasonable ceiling for
    # a Jetson that is already running the ZED.
    min_particles: 500      # floor on the cloud size
    max_particles: 2000     # ceiling; the cost and global-localization knob

    # KLD sampling decides how far the cloud may shrink once it is confident.
    pf_err: 0.05            # max allowed error between true and estimated distribution
    pf_z: 0.99              # confidence that the error stays within pf_err

    # Recovery injection, a separate mechanism from KLD: when the short-term
    # likelihood average falls below the long-term one, AMCL scatters random
    # particles to recover from a lost or kidnapped pose. Both are exponential
    # decay rates, so slow << fast.
    recovery_alpha_slow: 0.001  # long-term likelihood average decay rate
    recovery_alpha_fast: 0.1    # short-term likelihood average decay rate

    # --- Update gating ---------------------------------------------------
    # AMCL only runs a filter update after this much motion. THIS IS WHY A
    # STATIONARY ROVER NEVER CONVERGES: with no motion there is no update, so
    # the initial particle spread just sits there. Drive (teleop is fine, or
    # push it by hand -- AMCL reads odometry, not commands) a few metres past
    # distinctive geometry to collapse the cloud.
    update_min_d: 0.20       # m of translation between updates
    update_min_a: 0.20       # rad of rotation between updates
    resample_interval: 1     # filter updates between resamplings

    # --- Laser model -----------------------------------------------------
    # likelihood_field is the right default for a 2D lidar in a mostly-static
    # indoor map: cheaper than beam and much less prone to the local minima
    # the beam model falls into when the map is slightly wrong.
    laser_model_type: 'likelihood_field'
    laser_likelihood_max_dist: 2.0   # m, obstacle-inflation distance in the likelihood field

    # Hokuyo UST-10LX. laser_max_range matches slam_toolbox.yaml's
    # max_laser_range so localization and mapping agree on what counts as a
    # usable return; -1.0 means "use whatever the sensor reports".
    laser_min_range: -1.0    # m, -1.0 = use whatever the sensor reports
    laser_max_range: 10.0    # m, matches slam_toolbox.yaml's max_laser_range
    max_beams: 60            # rays subsampled per scan for the update

    # Beam likelihood mixture. z_hit + z_rand + z_max + z_short is the whole
    # probability mass for one ray, split across the four ways a return can be
    # produced: a real obstacle, random noise, a max-range miss, and an
    # unexpected near obstacle. likelihood_field uses z_hit and z_rand only.
    z_hit: 0.5               # weight, return came from a mapped obstacle
    z_rand: 0.5              # weight, uniform random measurement
    z_max: 0.05              # weight, no return (reads as max range)
    z_short: 0.05            # weight, unexpected obstacle nearer than the map
    z_shortscale: 0.1        # m, decay length of the z_short term
    sigma_hit: 0.2           # m, std dev of the Gaussian around a mapped obstacle
    lambda_short: 0.1        # 1/m, exponential rate of the z_short term

    # --- Initial pose ----------------------------------------------------
    # false = do NOT assume a fixed home position. Start the rover anywhere
    # and supply the pose with RViz's "2D Pose Estimate" tool (or publish to
    # /initialpose, or call /reinitialize_global_localization for no guess at
    # all). Set true and fill in initial_pose below ONLY if the rover really
    # does always start from the same spot.
    #
    # Heading is far less forgiving than position: the default yaw spread is
    # only about +-0.5 rad, so point the arrow the way the rover actually
    # faces. A position that is off by half a metre recovers; a heading that
    # is off by 90 deg usually does not.
    set_initial_pose: false
    always_reset_initial_pose: false   # true discards the saved pose on every start
    # initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

    # Keep the last pose across a restart, so a re-launch in the same spot
    # does not need the RViz click again.
    save_pose_rate: 0.5      # Hz the last pose is written to the parameter server

# Automatic re-localization. Started by amcl_localization.launch.py alongside
# AMCL, and needs no trigger: it watches AMCL's covariance and, when the rover
# is lost, drives it in short legs picked from the live LOCAL costmap until the
# particle cloud tightens. No teleop, no RViz click, no service call.
#
# REQUIRES Nav2 running. The local costmap and the spin / drive_on_heading
# behaviors both live there. Without it this node just watches and logs.
amcl_recovery:
  ros__parameters:
    enabled: true            # false disables recovery without unwiring the node

    # --- Inputs --------------------------------------------------------------
    # The LOCAL costmap, not the global one. It is built in the odom frame from
    # the live laser and never consults /map, so it stays correct while AMCL is
    # still wrong. That is what makes it safe to steer by while lost.
    costmap_topic: '/local_costmap/costmap'
    amcl_pose_topic: '/amcl_pose'
    base_frame: 'base_link'  # must match base_frame_id above

    # --- When is the rover lost ----------------------------------------------
    # Standard deviations, not variances. Entering recovery uses these loose
    # thresholds and leaving it uses the tight max_* ones below, so a pose
    # hovering near one value cannot oscillate the node in and out.
    lost_position_std: 0.60  # m, worse than this counts as lost
    lost_yaw_std: 0.40       # rad (23 deg)
    lost_confirm_time: 5.0   # s the rover must stay lost before recovery starts
    # AMCL publishes /amcl_pose only on a filter update, and an update needs
    # motion. A stationary rover that was never given a pose therefore sits
    # silent forever, which is the lost case, not a healthy one.
    pose_timeout: 30.0       # s of silence after AMCL goes active
    cooldown: 30.0           # s before another attempt may start
    monitor_period: 1.0      # s between checks

    # --- Kidnap detection ----------------------------------------------------
    # Second, independent detector. The covariance test above needs AMCL to
    # NOTICE it is lost, which needs a filter update, which needs the EKF to
    # have reported motion. Carry the rover with the camera struggling and no
    # update ever happens: the last /amcl_pose still reads converged and the
    # kidnap is invisible. Wheels disagreeing with the camera is visible either
    # way, and fires in about a second instead of lost_confirm_time.
    #
    # These are the same two topics ekf.yaml fuses as odom0 and odom1, compared
    # before the filter blends them into one number.
    lift_detection_enabled: true
    wheel_odom_topic: '/wheel/odometry'
    visual_odom_topic: '/zed/odom_with_cov'
    # Wheels this slow count as stationary. Mecanum roller slip cannot reach
    # this state: slip is a scale error on a TURNING wheel (measured 0.9686 of
    # truth in wheel_odometry.yaml), not a still wheel under real motion.
    lift_max_wheel_speed: 0.02   # m/s
    # The camera must claim at least this much for the pair to count as a
    # disagreement. Comfortably above the ~2e-5 m/s the ZED reports parked.
    lift_min_visual_speed: 0.15  # m/s
    lift_confirm_time: 1.0       # s of disagreement before it counts as a lift

    # --- When has it recovered -----------------------------------------------
    max_position_std: 0.25   # m, per-axis x and y standard deviation
    max_yaw_std: 0.15        # rad (8.6 deg)
    max_legs: 12             # legs per attempt before escalating or giving up

    # --- Motion --------------------------------------------------------------
    # A full turn. AMCL gates filter updates on translation OR rotation
    # (update_min_a 0.20 rad), so spinning does drive updates, and it covers the
    # 90 deg the 270 deg Hokuyo cannot see while stationary.
    survey_yaw: 6.283185307179586   # rad, 2*pi
    leg_distance: 1.5               # m driven per leg
    leg_speed: 0.2                  # m/s, half of roboclaw.yaml's 0.40 ceiling

    # --- Direction choice ----------------------------------------------------
    candidate_count: 36      # headings sampled evenly over 2*pi (10 deg apart)
    ray_range: 3.0           # m, how far each candidate ray is cast
    # Clearance required beyond leg_distance before a heading is eligible.
    # 0.45 m matches nav2_params.yaml's inflation_radius, so a leg never ends
    # inside an inflated obstacle.
    safety_margin: 0.45      # m
    # Costs at or above this block a ray. 90 sits between nav2's inflated cost
    # band and its 253 lethal value, so inflation is avoided, not just contact.
    lethal_threshold: 90
    # Treat unobserved cells as blocking. In a rolling local costmap, unknown
    # means the laser has not seen that cell, which is not the same as free.
    unknown_is_blocking: true

    # Scoring is  clearance - turn_weight*|turn| - retrace_penalty.
    turn_weight: 0.3         # m of clearance one radian of rotation is worth
    # Without this the rover ping-pongs along one corridor, because reversing
    # always scores well: it just drove through there.
    retrace_penalty: 1.5     # m of score subtracted for reversing
    retrace_cone: 0.6        # rad, half-angle around the reverse direction

    action_timeout: 60.0     # s allowed per spin or drive before it is abandoned

map_server:
  ros__parameters:
    # Overridden by the launch file's `map:=` argument; the value here is only
    # a fallback so the node is never left with an empty path.
    yaml_filename: ''
    frame_id: 'map'          # frame the served OccupancyGrid is stamped in
    topic_name: 'map'        # AMCL subscribes here when use_map_topic is true

map_saver:
  ros__parameters:
    # Thresholds match rtabmap/scripts/save_rtabmap.sh's --free/--occ, so a map
    # saved through either path uses the same occupancy cutoffs.
    save_map_timeout: 5.0            # s, wait for a /map message before giving up
    free_thresh_default: 0.196       # probability below which a cell is written free
    occupied_thresh_default: 0.65    # probability above which a cell is written occupied
