name: Mobile gateway
on:
  pull_request:
    paths: ['src/mobile_gateway/**', '.github/workflows/mobile-gateway.yml']
  push:
    paths: ['src/mobile_gateway/**', '.github/workflows/mobile-gateway.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test hardware-free state and HTTP contract
        env:
          PYTHONPATH: src/mobile_gateway
        run: python -m unittest discover -s src/mobile_gateway/test -v
